ear-gradient(135deg,color-mix(in srgb,var(--active) 6%,transparent),var(--card));border:1px solid color-mix(in srgb,var(--active) 28%,transparent);border-radius:3px;padding:18px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:16px}.cta h3{font-size:22px;color:var(--active);font-weight:400;margin-bottom:4px}.cta p{font-size:8px;color:var(--dim)}.bigbtn{background:color-mix(in srgb,var(--active) 9%,transparent);border:1px solid var(--active);border-radius:2px;padding:10px 20px;color:var(--active);font-size:15px;letter-spacing:.18em;cursor:pointer}.toast{position:fixed;bottom:18px;right:18px;z-index:10;background:color-mix(in srgb,var(--active) 9%,rgba(0,0,0,.8));border:1px solid color-mix(in srgb,var(--active) 45%,transparent);color:var(--active);padding:10px 14px;font-size:8px;opacity:0;transform:translateY(8px);transition:all .2s}.toast.show{opacity:1;transform:none}

const MODULES={
DEMAND:{name:'Opportunity Scorer',status:'SIGNAL',color:C.cyan,summary:'Extract what people want, who will pay, and whether NEURO should build, test, or ignore the opportunity.',flow:['signal ingest','buyer map','pain score','pay score','verdict'],sections:[{id:'score',title:'OPPORTUNITY SCORE',questions:[

{q:'Willingness to pay score',a:'Score 1-10. A 10 means urgent, repeated, budgeted, painful, and tied to revenue or survival.'},
{q:'Final verdict',a:'BUILD / TEST / IGNORE. Include one direct reason and the smallest next test.'}]}]},
OFFER:{name:'Offer Builder',status:'REVENUE',color:C.gold,summary:'Turn extracted demand into a clear offer, price ladder, and first-sale path.',flow:['promise','buyer','mechanism','price','first sale'],sections:[{id:'offer',title:'OFFER SYSTEM',questions:[
{q:'Offer name',a:'NEURO Opportunity Engine'},
{q:'One-line promise',a:'Find what people want, turn it into an offer, and automate the path to revenue.'},
{q:'Target customer',a:'Solo creators, agencies, local businesses, SaaS founders, and operators who need leads, content, sales, or automation.'},

{q:'First sale motion',a:'Run demand extraction for one niche, create a custom revenue workflow, send 20 personalized demos, close 1 pilot.'}]}]},
SKILLGEN:{name:'Hermes Skill Generator',status:'MEMORY',color:C.purple,summary:'Convert repeated successful workflows into reusable procedural skill files.',flow:['reflect','compress','write SKILL.md','reuse','lower cost'],sections:[{id:'skills',title:'SKILL FACTORY',questions:[
{q:'Skill to create',a:'neuro-demand-extraction.md\nneuro-offer-builder.md\nneuro-content-repurpose.md\nneuro-cold-outreach.md\nneuro-local-business-automation.md\nneuro-hermes-skill-writer.md'},
{q:'Trigger phrases',a:'Use this skill when the user asks to extract demand, build offers, create repeatable workflows, reduce token cost, or package a NEURO process.'},
{q:'Procedure to remember',a:'Inputs → scoring rules → decision gates → output format → examples → failure modes → handoff skills.'},
{q:'Closed loop rule',a:'After each successful execution, reflect, extract the repeatable logic, update the skill, and route future repeat tasks through procedural memory.'},
{q:'Cost doctrine',a:'Use expensive reasoning only for new, ambiguous, or high-value tasks. Repeated execution belongs in skills.'}]}]},
CONTENT:{name:'Agentic Content Engine',status:'DISTRIBUTE',color:C.orange,summary:'Launch emails, launch posts, X/LinkedIn playbooks, short video outlines, and campaign assets.',flow:['hook','angle','asset','platform','CTA'],sections:[{id:'content',title:'CONTENT ENGINE',questions:[
{q:'Launch thesis',a:'What is being launched, who is it for, and what belief must the audience adopt before they buy?'},
{q:'X / LinkedIn playbook',a:'Hook → tension → proof → mechanism → CTA. Short, sharp, no vague hype.'},
{q:'Launch email',a:'Problem → cost of inaction → mechanism → proof → direct ask.'},
{q:'Video playbook',a:'First 3 seconds: pattern interrupt. Next 20 seconds: problem. Next 30 seconds: mechanism. Final 10 seconds: CTA.'},
{q:'Repurpose map',a:'One idea becomes: X post, LinkedIn post, email, short video, carousel, landing section, sales DM.'}]}]},
AGENCY:{name:'AI Services Agency Builder',status:'INSTALL',color:C.green,summary:'Productize Hermes/Paperclip into a simple agency offer for businesses and solo creators.',flow:['diagnose','package','fulfill','retain','upsell'],sections:[{id:'agency',title:'AGENCY INSTALLER',questions:[

{q:'Delivery rule',a:'No custom chaos. Every client delivery must become a repeatable module, template, or Hermes skill.'}]}]},
VIDEO:{name:'HyperFrames Video Builder',status:'RENDER',color:C.pink,summary:'Plan HTML-native videos using HyperFrames / avatar-video style workflows without locking into a commercial brand.',flow:['script','scene','avatar','HTML frames','export'],sections:[{id:'video',title:'VIDEO BUILDER',questions:[
{q:'Video objective',a:'Explain, sell, onboard, announce, train, or pitch.'},

{q:'Skill output',a:'hackathon-scout should create a ranked opportunity table and a ready-to-submit application draft.'}]}]},
FIRECRAWL:{name:'Firecrawl Agent Test Lab',status:'STRESS',color:C.orange,summary:'Timed crawl/search tasks that stress-test agent orchestration, retrieval, scoring, and reporting.',flow:['task','crawl','extract','score','report'],sections:[{id:'ctf',title:'WEB AGENT TESTS',questions:[
{q:'Test mission',a:'Find a specific fact, market signal, competitor page, pricing clue, or policy update under time pressure.'},
{q:'Rules',a:'Limit tool calls, require citations, log failures, separate facts from inference, and score confidence.'},
{q:'Stress dimensions',a:'Ambiguity, recency, conflicting sources, noisy pages, login walls, duplicate content, hallucination traps.'},
{q:'Output report',a:'Answer, sources, confidence, unresolved risks, next crawl target, and skill improvement note.'},
{q:'Skill purpose',a:'firecrawl-agent-ctf hardens the web-agent layer before it is trusted with business workflows.'}]}]},
VAULT:{name:'Vault Registry',status:'CREDENTIALS',color:C.gold,summary:'Credential and token workflow memory for Hermes Vault without exposing secrets to agents or logs.',flow:['login','token','refresh','audit','redact'],sections:[{id:'vault',title:'VAULT',questions:[

GUARD:{name:'Anti-Moloch Governance Panel',status:'GUARD',color:C.pink,summary:'Keep financial/entity/agency workflows compliant, bounded, logged, and human-approved.',flow:['scope','risk','approval','execute','audit'],sections:[{id:'guard',title:'GUARDRAIL',questions:[

let active='DEMAND';const answers=JSON.parse(localStorage.getItem('chaos_rank_v2_answers')||'{}');
function k(sec,i){return `${active}-${sec}-${i}`}function getA(sec,i){return answers[k(sec,i)]??MODULES[active].sections.find(s=>s.id===sec).questions[i].a}function setA(sec,i,v){answers[k(sec,i)]=v;localStorage.setItem('chaos_rank_v2_answers',JSON.stringify(answers));counts()}function toast(txt='COPIED'){const t=document.getElementById('toast');t.textContent=txt;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1300)}function clip(txt){navigator.clipboard?.writeText(txt);toast()}function moduleText(id=active){const m=MODULES[id];let text=`${m.name.toUpperCase()}\n${'='.repeat(60)}\n${m.summary}\n\n`;m.sections.forEach(s=>{text+=`${s.title}\n${'-'.repeat(40)}\n`;s.questions.forEach((q,i)=>{const val=id===active?getA(s.id,i):q.a;text+=`\nQ: ${q.q}\nA: ${val}\n`});text+='\n'});return text}function copyModule(){clip(moduleText())}function copyAll(){let text='AGENTROPOLIS CHAOS RANK v2\n'+ '='.repeat(60)+'\n\nMASTER CHAIN\n'+CHAIN.join(' → ')+'\n\n';Object.keys(MODULES).forEach(id=>text+=moduleText(id)+'\n');clip(text)}function improve(sec,i){const val=getA(sec,i);setA(sec,i,`OPERATOR VERSION:\n\n${val}\n\nNEXT ACTION:\nDefine owner, first input, expected output, risk gate, monetization path, and the Hermes skill this should become.`);render();toast('IMPROVED LOCALLY')}
function render(){const m=MODULES[active];document.documentElement.style.setProperty('--active',m.color);document.getElementById('tabs').innerHTML=Object.entries(MODULES).map(([id,x])=>`<button class="tab mono ${id===active?'active':''}" onclick="active='${id}';render()"><div>${id}</div><small>${x.name}</small></button>`).join('');document.getElementById('chain').innerHTML=CHAIN.map(x=>`<span class="chip mono">${x}</span>`).join('');document.getElementById('app').innerHTML=`<div class="dashboard"><div class="metric mono"><label>MODULES</label><strong class="bebas">${Object.keys(MODULES).length}</strong></div><div class="metric mono"><label>ACTIVE</label><strong class="bebas">${m.status}</strong></div><div class="metric mono"><label>CHAIN NODES</label><strong class="bebas">${CHAIN.length}</strong></div><div class="metric mono"><label>MODE</label><strong class="bebas">STATIC</strong></div></div><div class="module-head"><div class="mono module-kicker">AGENTROPOLIS // ${m.status}</div><h1 class="bebas">${m.name}</h1><p>${m.summary}</p><div class="flow mono">${m.flow.map(f=>`<span>${f}</span>`).join('')}</div></div>${m.sections.map(s=>`<section id="${s.id}"><div class="section-title"><div class="bar"></div><h2 class="bebas">${s.title}</h2><div class="line"></div></div><div class="qstack">${s.questions.map((q,i)=>{const val=getA(s.id,i).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const cls=val.length>250?'qcard full':'qcard';return `<div class="${cls}"><div class="qhead"><div class="question mono">${q.q}</div><div class="actions"><button class="mini ai" onclick="improve('${s.id}',${i})">✦ IMPROVE</button><button class="mini" onclick="clip(getA('${s.id}',${i}))">COPY</button></div></div><div class="answer"><textarea oninput="setA('${s.id}',${i},this.value)">${val}</textarea></div><div class="count mono" data-count="${s.id}-${i}">0 words</div></div>`}).join('')}</div></section>`).join('')}<div class="cta"><div><h3 class="bebas">READY TO EXECUTE?</h3><p class="mono">Copy this module into Codex, Hermes, or your AGENTROPOLIS Skill Pack queue.</p></div><button class="bigbtn bebas" onclick="copyModule()">COPY MODULE</button></div>`;counts();drawScene(m.color)}
function counts(){const m=MODULES[active];m.sections.forEach(s=>s.questions.forEach((q,i)=>{const el=document.querySelector(`[data-count="${s.id}-${i}"]`);if(el)el.textContent=`${getA(s.id,i).trim().split(/\s+/).filter(Boolean).length} words`}))}function clock(){document.getElementById('clock').textContent=new Date().toTimeString().slice(0,8)}setInterval(clock,1000);clock();
let sceneColor=C.cyan,fog=[];const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');function resize(){canvas.width=innerWidth;canvas.height=innerHeight}addEventListener('resize',resize);resize();function drawScene(color){sceneColor=color||C.cyan;fog=Array.from({length:42},()=>({x:Math.random()*1600,y:Math.random()*330,r:50+Math.random()*95,vx:(Math.random()-.5)*.08,col:[sceneColor,C.blue,C.purple,C.gold][Math.floor(Math.random()*4)]}))}function loop(){const W=canvas.width,H=canvas.height;ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#020508');bg.addColorStop(.5,'#040d1a');bg.addColorStop(1,'#020508');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.save();ctx.globalAlpha=.04;const hor=H*.6;for(let i=-14;i<=14;i++){ctx.beginPath();ctx.moveTo(W/2+i*72,hor);ctx.lineTo(W/2+i*72*5,H+80);ctx.strokeStyle=sceneColor;ctx.lineWidth=.5;ctx.stroke()}for(let j=0;j<8;j++){const f=j/8,y=hor+(H-hor+80)*(f*f),sp=W*.5+(H-hor+80)*f*2.2;ctx.beginPath();ctx.moveTo(W/2-sp,y);ctx.lineTo(W/2+sp,y);ctx.strokeStyle=sceneColor;ctx.lineWidth=.3;ctx.stroke()}ctx.restore();fog.forEach(f=>{f.x+=f.vx;if(f.x<-f.r)f.x=W+f.r;if(f.x>W+f.r)f.x=-f.r;const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);g.addColorStop(0,f.col+'0e');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(f.x-f.r,f.y-f.r,f.r*2,f.r*2)});ctx.fillStyle='rgba(0,0,0,.05)';for(let y=0;y<H;y+=3)ctx.fillRect(0,y,W,1);requestAnimationFrame(loop)}drawScene(C.cyan);render();loop();
