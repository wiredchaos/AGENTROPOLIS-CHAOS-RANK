<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" role="img" aria-label="AGENTOPOLIS CHAOS RANK — social card">
  <title>AGENTOPOLIS CHAOS RANK — AEO · GEO · Agent Citation Infrastructure</title>
  <defs>
    <filter id="glow-cyan-lg" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-red-lg" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-text" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="center-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%"   stop-color="#00ffe6" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#050810" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="red-glow" cx="75%" cy="30%" r="35%">
      <stop offset="0%"   stop-color="#ff2d55" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#050810" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#050810"/>

  <!-- Grid pattern -->
  <g opacity="0.06" stroke="#00ffe6" stroke-width="1">
    <!-- Vertical lines every 40px -->
    <line x1="40"   y1="0" x2="40"   y2="630"/>
    <line x1="80"   y1="0" x2="80"   y2="630"/>
    <line x1="120"  y1="0" x2="120"  y2="630"/>
    <line x1="160"  y1="0" x2="160"  y2="630"/>
    <line x1="200"  y1="0" x2="200"  y2="630"/>
    <line x1="240"  y1="0" x2="240"  y2="630"/>
    <line x1="280"  y1="0" x2="280"  y2="630"/>
    <line x1="320"  y1="0" x2="320"  y2="630"/>
    <line x1="360"  y1="0" x2="360"  y2="630"/>
    <line x1="400"  y1="0" x2="400"  y2="630"/>
    <line x1="440"  y1="0" x2="440"  y2="630"/>
    <line x1="480"  y1="0" x2="480"  y2="630"/>
    <line x1="520"  y1="0" x2="520"  y2="630"/>
    <line x1="560"  y1="0" x2="560"  y2="630"/>
    <line x1="600"  y1="0" x2="600"  y2="630"/>
    <line x1="640"  y1="0" x2="640"  y2="630"/>
    <line x1="680"  y1="0" x2="680"  y2="630"/>
    <line x1="720"  y1="0" x2="720"  y2="630"/>
    <line x1="760"  y1="0" x2="760"  y2="630"/>
    <line x1="800"  y1="0" x2="800"  y2="630"/>
    <line x1="840"  y1="0" x2="840"  y2="630"/>
    <line x1="880"  y1="0" x2="880"  y2="630"/>
    <line x1="920"  y1="0" x2="920"  y2="630"/>
    <line x1="960"  y1="0" x2="960"  y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>
    <line x1="1160" y1="0" x2="1160" y2="630"/>
    <!-- Horizontal lines -->
    <line x1="0" y1="40"  x2="1200" y2="40"/>
    <line x1="0" y1="80"  x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Ambient glow fills -->
  <rect width="1200" height="630" fill="url(#center-glow)"/>
  <rect width="1200" height="630" fill="url(#red-glow)"/>

  <!-- Border -->
  <rect x="2" y="2" width="1196" height="626" rx="12"
        stroke="#00ffe6" stroke-width="2" fill="none" opacity="0.35" filter="url(#glow-cyan-lg)"/>
  <rect x="2" y="2" width="1196" height="626" rx="12"
        stroke="#00ffe6" stroke-width="1" fill="none" opacity="0.4"/>

  <!-- Corner circuit marks -->
  <polyline points="2,60 2,2 60,2"         stroke="#00ffe6" stroke-width="3" fill="none" opacity="0.7"/>
  <polyline points="1140,2 1198,2 1198,60"  stroke="#00ffe6" stroke-width="3" fill="none" opacity="0.7"/>
  <polyline points="2,570 2,628 60,628"     stroke="#00ffe6" stroke-width="3" fill="none" opacity="0.7"/>
  <polyline points="1140,628 1198,628 1198,570" stroke="#00ffe6" stroke-width="3" fill="none" opacity="0.7"/>

  <!-- Left: Icon Mark (scaled 3× from 72→216, centered at y=315-108=207) -->
  <g transform="translate(80, 207) scale(3)">
    <!-- Signal bars -->
    <rect x="9"  y="45" width="9"  height="15" rx="2" fill="#00ffe6" fill-opacity="0.38" filter="url(#glow-cyan-lg)"/>
    <rect x="20" y="36" width="9"  height="24" rx="2" fill="#00ffe6" fill-opacity="0.58" filter="url(#glow-cyan-lg)"/>
    <rect x="31" y="22" width="10" height="38" rx="2" fill="#ff2d55"                     filter="url(#glow-red-lg)"/>
    <rect x="43" y="30" width="9"  height="30" rx="2" fill="#00ffe6" fill-opacity="0.48" filter="url(#glow-cyan-lg)"/>
    <!-- Fang arrow -->
    <path d="M36 5 L29 18 L36 15.5 L43 18 Z" fill="#ff2d55" filter="url(#glow-red-lg)"/>
  </g>

  <!-- Vertical divider -->
  <line x1="380" y1="80" x2="380" y2="550" stroke="#00ffe6" stroke-width="1.5" opacity="0.2"/>

  <!-- Right: Text content -->
  <!-- District tag -->
  <rect x="420" y="110" width="230" height="34" rx="17"
        fill="rgba(0,255,230,0.08)" stroke="#00ffe6" stroke-width="1" opacity="0.7"/>
  <text x="535" y="132" text-anchor="middle"
        font-family="'JetBrains Mono','Courier New',monospace"
        font-size="12" font-weight="600" letter-spacing="3"
        fill="#00ffe6">CHAOS RANK DISTRICT</text>

  <!-- Main headline -->
  <text x="420" y="230"
        font-family="'Orbitron','Space Grotesk','JetBrains Mono',monospace"
        font-weight="900" font-size="72" letter-spacing="2"
        fill="#e8f0fe" filter="url(#glow-text)">AGENTOPOLIS</text>
  <text x="420" y="310"
        font-family="'JetBrains Mono','Courier New',monospace"
        font-weight="700" font-size="44" letter-spacing="8"
        fill="#00ffe6" filter="url(#glow-cyan-lg)">CHAOS RANK</text>

  <!-- Divider accent -->
  <line x1="420" y1="336" x2="1140" y2="336" stroke="#00ffe6" stroke-width="1" opacity="0.25"/>

  <!-- Tagline -->
  <text x="420" y="378"
        font-family="'Inter','system-ui',sans-serif"
        font-size="22" fill="#6a7fa8" letter-spacing="0.5">
    AEO  •  GEO  •  UGC  •  Agent Citation Infrastructure
  </text>

  <!-- Bottom doctrine line -->
  <text x="420" y="430"
        font-family="'JetBrains Mono','Courier New',monospace"
        font-size="16" fill="#00ffe6" fill-opacity="0.6" letter-spacing="0.5">
    "Machine-readable proof for the agentic web."
  </text>

  <!-- Signal bars — decorative right edge -->
  <rect x="1080" y="400" width="24" height="80"  rx="3" fill="#00ffe6" fill-opacity="0.12"/>
  <rect x="1112" y="360" width="24" height="120" rx="3" fill="#ff2d55"  fill-opacity="0.35" filter="url(#glow-red-lg)"/>
  <rect x="1144" y="380" width="24" height="100" rx="3" fill="#00ffe6" fill-opacity="0.18"/>

  <!-- Bottom bar -->
  <rect x="0" y="594" width="1200" height="36" fill="rgba(0,255,230,0.04)"/>
  <line x1="0" y1="594" x2="1200" y2="594" stroke="#00ffe6" stroke-width="1" opacity="0.2"/>
  <text x="60" y="617"
        font-family="'JetBrains Mono','Courier New',monospace"
        font-size="13" fill="#00ffe6" fill-opacity="0.45" letter-spacing="1">
    AGENTOPOLIS · CHAOS RANK DISTRICT · github.com/wiredchaos/AGENTROPOLIS-CHAOS-RANK
  </text>
  <!-- Red accent dot -->
  <circle cx="42" cy="612" r="4" fill="#ff2d55" fill-opacity="0.8"/>
</svg>
