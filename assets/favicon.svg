<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="AGENTOPOLIS CHAOS RANK favicon">
  <title>AGENTOPOLIS CHAOS RANK</title>
  <defs>
    <filter id="fg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fr" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="5" fill="#050810"/>

  <!-- Border glow -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="4.5"
        stroke="#00ffe6" stroke-width="1" fill="none" opacity="0.7" filter="url(#fg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="4.5"
        stroke="#00ffe6" stroke-width="0.5" fill="none" opacity="0.4"/>

  <!-- Circuit corner marks -->
  <polyline points="0.5,7 0.5,0.5 7,0.5"   stroke="#00ffe6" stroke-width="1.2" fill="none" opacity="0.8"/>
  <polyline points="25,0.5 31.5,0.5 31.5,7" stroke="#00ffe6" stroke-width="1.2" fill="none" opacity="0.8"/>
  <polyline points="0.5,25 0.5,31.5 7,31.5" stroke="#00ffe6" stroke-width="1.2" fill="none" opacity="0.8"/>
  <polyline points="25,31.5 31.5,31.5 31.5,25" stroke="#00ffe6" stroke-width="1.2" fill="none" opacity="0.8"/>

  <!-- Signal bars -->
  <rect x="4"  y="18" width="4" height="10" rx="1" fill="#00ffe6" fill-opacity="0.4" filter="url(#fg)"/>
  <rect x="10" y="13" width="4" height="15" rx="1" fill="#00ffe6" fill-opacity="0.6" filter="url(#fg)"/>
  <rect x="16" y="7"  width="4" height="21" rx="1" fill="#ff2d55"                   filter="url(#fr)"/>
  <rect x="22" y="10" width="4" height="18" rx="1" fill="#00ffe6" fill-opacity="0.5" filter="url(#fg)"/>

  <!-- Fang / arrow above dominant bar -->
  <path d="M18 2 L14 8 L18 6.5 L22 8 Z" fill="#ff2d55" filter="url(#fr)"/>

  <!-- Base line -->
  <line x1="3" y1="30" x2="27" y2="30" stroke="#00ffe6" stroke-width="0.6" opacity="0.3"/>
</svg>
